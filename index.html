<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que la página se vea bien en celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="asset/style.css">
</head>
<body>
  <main class="login">
    <form class="tarjeta" id="formLogin">
      <h1>INICIAR SESIÓN</h1>

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" placeholder="ejemplo@gmail.com" required>

      <label for="clave">Contraseña:</label>
      <input type="password" id="clave" placeholder="Ingrese su contraseña" required>

      <button class="boton" type="submit">ACEPTAR</button>
      <!-- Aquí se muestra el error si los datos son incorrectos -->
      <p class="error" id="errorLogin"></p>
    </form>
  </main>

  <!-- comun.js primero: login.js usa sus funciones -->
  <script src="asset/js/comun.js"></script>
  <script src="asset/js/login.js"></script>
</body>
</html>
